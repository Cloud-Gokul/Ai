version: '3.9'

services:
  faceweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faceweb_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - PORT=5000
    volumes:
      - ./templates:/app/templates:ro
      - ./logs:/app/logs
    devices:
      # Camera device mapping (works on Linux)
      - /dev/video0:/dev/video0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - faceweb_network

networks:
  faceweb_network:
    driver: bridge
