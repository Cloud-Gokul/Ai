<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mask Detection Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>🤖 AI Monitor</h2>
        <ul>
            <li class="active">Live Feed</li>
            <li>Logs</li>
            <li>Settings</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main">

        <!-- Top Bar -->
        <div class="topbar">
            <h1>Face Mask Detection</h1>
            <div id="time"></div>
        </div>

        <!-- Video Section -->
        <div class="content">

            <div class="video-box">
                <img src="{{ url_for('video') }}" id="videoFeed">
            </div>

            <div class="info-box">
                <h3>Status</h3>
                <p><span class="dot"></span> Camera Active</p>

                <h3>System</h3>
                <p>Model: CNN</p>
                <p>Resolution: 640x480</p>
            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
